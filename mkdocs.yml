site_name: BaGet Extension
site_description: A NuGet, Maven, NVM, Docker and symbol server
site_author: Loic Sharma
site_url: https://pieroviano.github.io/BaGet/

repo_name: pieroviano/BaGet
repo_url: https://github.com/pieroviano/BaGet

copyright: 'Copyright &copy; 2020 Loic Sharma'

theme:
  name: material
  language: en
  palette:
    primary: yellow
    accent: yellow
  font:
    text: Roboto
    code: Roboto Mono

extra:
  social:
    - type: github-alt
      link: https://github.com/loic-sharma
    - type: twitter
      link: https://twitter.com/bagetapp

markdown_extensions:
  - markdown.extensions.admonition
  - markdown.extensions.codehilite:
      guess_lang: false
  - markdown.extensions.toc:
      permalink: true

nav:
  - Overview: index.md
  - Installation:
    - On your computer: installation/local.md
    - Docker: installation/docker.md
    - Azure: installation/azure.md
    - AWS: installation/aws.md
    - Google cloud: installation/gcp.md
    - Alibaba cloud: installation/aliyun.md
    - Windows IIS proxy: installation/iis-proxy.md
  - Configuration: configuration.md
  - Repositories: repositories.md
  - Package formats: formats.md
  - npm registry: npm-registry.md
  - Maven repositories: maven-repositories.md
  - Docker registry: docker-registry.md
  - Retention and cleanup: retention.md
  - Remote repositories: remote-repositories.md
  - Virtual repositories: virtual-repositories.md
  - Access control: access-control.md
  - Vulnerability scanning: vulnerability-scanning.md
  - Administration REST API: admin-api.md
  - UI coverage: ui-coverage.md
  - Import:
    - Local feeds: import/local-feeds.md
    - NuGet.Server: import/nugetserver.md
    - NuGet.org: import/nugetorg.md
  - Advanced:
    - Architecture: advanced/architecture.md
    - Debugging: advanced/debugging.md
    - BaGet Extension SDK: advanced/sdk.md
    - Server API: advanced/api.md
  - BaGet Extension vs. other:
    - nuget.org: vs/nugetorg.md
    - NuGet.Server: vs/nugetserver.md
    - Local feeds: vs/local-feeds.md
    - Azure Artifacts: vs/azure-artifacts.md
    - MyGet: vs/myget.md
    - LiGet: vs/liget.md
    - Artifactory: vs/artifactory.md
    - Nexus: vs/nexus.md
    - TeamCity: vs/teamcity.md
